# ReadTheDocs Build-Konfiguration (v2) fuer das separate "fair-web-en"-Projekt
# (eigene Subdomain, nur Englisch). Im RTD-Projekt-Admin unter
# Settings -> "Configuration file" auf ".readthedocs-en.yaml" setzen,
# da der Standardpfad ".readthedocs.yaml" bereits vom "fair-web"-Projekt
# (zweisprachig) belegt ist.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.en.yml

python:
  install:
    - requirements: docs/requirements.txt
